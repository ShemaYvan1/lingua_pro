{% extends "base.html" %}
{% set editing = course_id is not none %}
{% block title %}{{ 'Edit course' if editing else 'Add course' }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('admin_course', course_id=course_id) if editing else url_for('admin_dashboard') }}">← Back</a></p>
<section class="card narrow">
  <h2>{{ 'Edit course' if editing else 'Add course' }}</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Course name
      <input name="name" required placeholder="e.g. English B1" value="{{ course.get('name', '') }}">
    </label>
    <div class="grid-2">
      <label>Language
        <input name="language" required placeholder="e.g. English" value="{{ course.get('language', '') }}">
      </label>
      <label>Level
        <input name="level" required placeholder="e.g. B1" value="{{ course.get('level', '') }}">
      </label>
    </div>
    <label>Schedule
      <input name="schedule" required placeholder="e.g. Mon & Wed 17:00-18:30" value="{{ course.get('schedule', '') }}">
    </label>
    <label>Teacher
      <input name="teacher" required value="{{ course.get('teacher', '') }}">
    </label>
    <label>Maximum number of students
      <input name="max_students" type="number" min="1" max="500" required
             value="{{ course.get('max_students', '') }}">
    </label>
    <button class="btn" type="submit">{{ 'Save changes' if editing else 'Add course' }}</button>
  </form>
</section>
{% endblock %}
